<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* "/" opens the home page; addresses of the previous version of the site go to their new pages.
         The previous React app stays in src/ but is no longer served. */
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        var map = [
          [/^\/$/, '/dc/Main.dc.html'],
          [/^\/(algebra|geometry|advanced-math|data-analysis|problem-solving)$/, '/practice'],
          [/^\/study-plan$/, '/plan'],
          [/^\/study(\/|$)/, '/lesson'],
          [/^\/admin\/.+/, '/admin'],
          [/^\/(practice\/sat-tests|sat-test\/.+)$/, '/mock-tests'],
          [/^\/(test-history|test-review(\/.*)?)$/, '/history'],
          [/^\/support$/, '/help'],
          [/^\/test\/.+/, '/practice']
        ];
        for (var i = 0; i < map.length; i++) {
          if (map[i][0].test(p)) { location.replace(map[i][1] + location.search + location.hash); return; }
        }
        location.replace('/dc/NotFound.dc.html');
      })();
    </script>
